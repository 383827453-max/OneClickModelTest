name: 💡 功能建议
description: 提出一个新功能或改进想法
title: "[Feature] "
labels: ["enhancement"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        欢迎提想法。说清楚**你要解决什么问题**比描述方案更重要——
        同一种需求往往有更省事的实现路径。

  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过现有 Issue 与 CHANGELOG，确认没有重复或已在计划中
          required: true

  - type: dropdown
    id: kind
    attributes:
      label: 类型
      options:
        - 全新功能
        - 现有功能改进
        - 界面 / 交互优化
        - 性能优化
        - 文档完善
        - 其他
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 你遇到的实际问题
      description: |
        描述场景与痛点，不要说「加个 XX 功能」就完事。
        例如：「我有 20 多个中转站要定期巡检，现在得一个个手动填地址点检测。」
      placeholder: |
        我现在需要 ...
        目前的做法是 ...
        这带来 ... 的麻烦
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 你希望它怎么工作（有想法就写，没有可写「暂无」）
      placeholder: |
        希望支持多地址配置文件，一次性批量巡检并汇总结果
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 你试过哪些变通办法？为什么不够用？
    validations:
      required: false

  - type: dropdown
    id: contribution
    attributes:
      label: 是否愿意自己实现
      description: 本仓库是 MIT 协议，欢迎 PR
      options:
        - 愿意，我可以提 PR
        - 愿意，但需要一些指点和方向
        - 只提建议，没有时间实现
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: 其他说明
      description: 参考实现、截图、相关链接等
    validations:
      required: false
